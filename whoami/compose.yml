name: whoami
# Diagnostic service, reachable only over the tailnet. Shows the headers and
# the source address Traefik forwards, and is the pilot for the per-host
# wildcard certificate.

# >> -------------------- Networks -------------------- << #
networks:
  tunnel-network:
    external: true

# >> -------------------- Services -------------------- << #
services:
  whoami:
    image: docker.io/traefik/whoami:v1.11
    container_name: whoami
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      - TZ=America/Sao_Paulo
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tunnel-network"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${INSTANCE_HOST:?INSTANCE_HOST is not set}.leazirondi.com.br`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=cloudflare"
      - "traefik.http.routers.whoami.tls.domains[0].main=${INSTANCE_HOST}.leazirondi.com.br"
      - "traefik.http.routers.whoami.tls.domains[0].sans=*.${INSTANCE_HOST}.leazirondi.com.br"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - tunnel-network
