name: n8n
# >> -------------------- Networks -------------------- << #
networks:
  tunnel-network:
    external: true

# >> -------------------- Secrets --------------------- << #
secrets:
  n8n_db_pwd:
    file: ./secrets/n8n_db_pwd

# >> -------------------- Services -------------------- << #
services:
  n8n:
    image: docker.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: "1000:1000"
    userns_mode: "keep-id"
    security_opt:
      - no-new-privileges=true
    environment:
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - N8N_HOST=n8n.leazirondi.com.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_EDITOR_BASE_URL=https://n8n.leazirondi.com.br
      - WEBHOOK_URL=https://n8n.leazirondi.com.br/
      - N8N_PROXY_HOPS=2
      - PUBLIC_IMAGE_BASE_URL=https://n8n.leazirondi.com.br/webhook
      
      # Integração com PostgreSQL
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/n8n_db_pwd
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.leazirondi.com.br`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=tunnel-network"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ${HOME}/volumes/n8n/data:/home/node/.n8n
      - ${HOME}/volumes/n8n/files:/files
      - ${HOME}/volumes/n8n/n8n-files:/home/node/.n8n-files
      - ${HOME}/volumes/n8n/fonts:/srv/fonts:ro
    secrets:
      - n8n_db_pwd
    networks:
      - tunnel-network
    depends_on:
      n8n-postgres:
        condition: service_healthy

  n8n-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD_FILE=/run/secrets/n8n_db_pwd
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ${HOME}/volumes/n8n/postgres:/var/lib/postgresql/data
    secrets:
      - n8n_db_pwd
    networks:
      - tunnel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

