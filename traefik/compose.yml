name: traefik
# >> -------------------- Networks -------------------- << #
# One network per kind of exposure. A service joins exactly the one that
# matches how it is reached; nothing joins cloudflared-network but this stack.
networks:
  # Traefik <-> cloudflared
  cloudflared-network:
    name: cloudflared-network
  # Traefik <-> services published through the Cloudflare Tunnel or the tailnet
  tunnel-network:
    name: tunnel-network
  # Traefik <-> services published directly on the host's public address
  public-network:
    name: public-network
  socket-proxy:
    external: true

# >> -------------------- Secrets --------------------- << #
secrets:
  tunnel_token:
    file: ./secrets/tunnel_token
  tunnel_token_unesp:
    file: ./secrets/tunnel_token_unesp
  cloudflare_dns_api_token:
    file: ./secrets/cloudflare_dns_api_token

# >> -------------------- Services -------------------- << #
services:
  traefik:
    image: docker.io/library/traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TZ=America/Sao_Paulo
      # DNS-01 challenge for the wildcard certificates
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_dns_api_token
    ports:
      # Each entrypoint is bound to one host address, so a router on the
      # tailnet entrypoint can never be reached from the internet and vice
      # versa. TAILNET_IP and PUBLIC_IP are exported by scripts/deploy.sh.
      - "${TAILNET_IP:?TAILNET_IP is not set}:443:443/tcp"
      - "${PUBLIC_IP:?PUBLIC_IP is not set}:443:8443/tcp"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./config/static/traefik.yml:/traefik.yml:ro
      - ./config/dynamic:/dynamic:ro
      - ${HOME}/volumes/traefik/logs:/var/log/traefik/
      - ${HOME}/volumes/traefik/certs:/etc/certs
    secrets:
      - cloudflare_dns_api_token
    networks:
      - cloudflared-network
      - tunnel-network
      - public-network
      - socket-proxy

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - cloudflared-network
    depends_on:
      traefik:
        condition: service_healthy

  cloudflared-unesp:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared-unesp
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN_UNESP}
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - cloudflared-network
    depends_on:
      traefik:
        condition: service_healthy
