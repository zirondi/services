global:
  sendAnonymousUsage: false
  checkNewVersion: true

api:
  dashboard: true

log:
  level: "INFO"
  filepath: "/var/log/traefik/traefik.log"
  noColor: true
  maxsize: 100
  compress: true

accesslog:
  addInternals: true
  filePath: "/var/log/traefik/access.log"
  bufferingsize: 100

providers:
  docker:
    exposedByDefault: false
    # Default network; services on public-network override it with the
    # traefik.docker.network label
    network: "tunnel-network"
    endpoint: "tcp://socket-proxy:2375"
  file:
    directory: "/dynamic"
    watch: true

entrypoints:
  # Cloudflare Tunnel: cloudflared reaches this one over cloudflared-network
  web:
    address: ":80"
  # Tailnet: published only on the host's Tailscale address
  websecure:
    address: ":443"
  # Internet: published only on the host's public address (host port 443)
  public:
    address: ":8443"
    http:
      middlewares:
        - security-headers@file
  internal:
    address: ":9000"

ping:
  entryPoint: "internal"

certificatesResolvers:
  cloudflare:
    acme:
      email: "acme@leazirondi.com.br"
      storage: "/etc/certs/acme.json"
      # When testing a new setup, switch to the staging CA
      # (https://acme-staging-v02.api.letsencrypt.org/directory) and delete
      # acme.json before coming back to production.
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        propagation:
          delayBeforeChecks: 30
