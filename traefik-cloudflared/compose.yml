name: traefik-cloudflared
# >> -------------------- Networks -------------------- << #
networks:
  edge-network:
    name: edge-network
  socket-proxy:
    external: true
  tunnel:
    name: tunnel

# >> -------------------- Secrets --------------------- << #
secrets:
  tunnel_token:
    file: ./secrets/tunnel_token
  tunnel_token_unesp:
    file: ./secrets/tunnel_token_unesp

# >> -------------------- Services -------------------- << #
services:
  traefik:
    image: docker.io/library/traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./config/static/traefik.yml:/traefik.yml:ro
      - ./config/dynamic:/dynamic:ro
      - ${HOME}/volumes/traefik/logs:/var/log/traefik/
    networks:
      - edge-network
      - socket-proxy
      - tunnel

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - tunnel
    depends_on:
      traefik:
        condition: service_healthy

  cloudflared-unesp:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared-unesp
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN_UNESP}
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - tunnel
    depends_on:
      traefik:
        condition: service_healthy
