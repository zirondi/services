global:
  sendAnonymousUsage: false
  checkNewVersion: true

api:
  dashboard: true

log:
  level: "INFO"
  filepath: "/var/log/traefik/traefik.log"
  noColor: true
  maxsize: 100
  compress: true

accesslog:
  addInternals: true
  filePath: "/var/log/traefik/access.log"
  bufferingsize: 100

providers:
  docker:
    exposedByDefault: false
    network: "edge-network"
    endpoint: "tcp://socket-proxy:2375"
  file:
    directory: "/dynamic"
    watch: true

entrypoints:
  web:
    address: ":80"
  internal:
    address: ":9000"

ping:
  entryPoint: "internal"
