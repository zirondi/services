name: diun
# Diun: tells Telegram when an image in use has a newer release. Image tags
# are pinned across the stacks, so Diun watches each image's repository for
# new tags instead of digest changes of the same tag (config/diun.yml).
# Containers on this host come from the Docker API through socket-proxy;
# the rpi3 containers are declared in Nix, out of reach of this socket, and
# are listed in config/rpi3-images.yml. No web interface, so no exposure.
#
# When a notice arrives, bump the tag in the compose file (or in
# hosts/rpi3/services.nix) and deploy as usual.

# >> -------------------- Networks -------------------- << #
networks:
  socket-proxy:
    external: true

# >> -------------------- Secrets --------------------- << #
secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  # A JSON array, one string per destination: ["<chat id>:<topic id>"]
  telegram_chat_ids:
    file: ./secrets/telegram_chat_ids

# >> -------------------- Services -------------------- << #
services:
  diun:
    image: docker.io/crazymax/diun:4.33.1
    container_name: diun
    hostname: hetzner
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command: ["serve"]
    environment:
      - TZ=America/Sao_Paulo
      - LOG_LEVEL=info
      - DIUN_CONFIG=/etc/diun/diun.yml
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./config:/etc/diun:ro
      - ${HOME}/volumes/diun/data:/data
    networks:
      - socket-proxy
    secrets:
      - telegram_bot_token
      - telegram_chat_ids
